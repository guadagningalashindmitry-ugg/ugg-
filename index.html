top:0;

background:rgba(255,253,248,.97);

.header{
max-width:1400px;
margin:auto;
padding:17px 5%;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px
}

.logo{
font-family:Arial,sans-serif;
font-size:34px;
font-weight:900;
letter-spacing:8px
}

nav{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:2px
}

nav button{
border:0;
background:none;
padding:8px;

}

nav button:hover{
text-decoration:underline
}

.languages{

gap:3px;

}

.languages button{

}

.languages button.active{

color:white
}

main{
max-width:1400px;
margin:auto;
padding:45px 5%
}

.page{display:none}
.page.active{display:block}

.hero{
min-height:570px;
display:flex;
flex-direction:column;
justify-content:center;

}

.hero-small{

}

.hero p{
font-size:21px;

}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px
}

.btn{
border:0;
background:#171717;
color:white;

border-radius:4px
}

.btn.secondary{
background:transparent;
color:#171717;
border:1px solid #171717
}

.section{
margin:70px 0
}

.section h2,
.page>h1{
font-size:36px;
line-height:1.1
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px
}

.card{
background:#fffdf8;
border:1px solid #d8d1c6;
padding:27px;
border-radius:5px
}

.card h2{
line-height:1.15
}

.eyebrow{
font:10px Arial,sans-serif;
font-weight:bold;
letter-spacing:3px;

}

.muted{
color:#777;
font-size:14px
}

form{
background:#fffdf8;
border:1px solid #d8d1c6;
padding:28px;
max-width:850px
}

label{
display:block;
font-weight:bold;
margin-bottom:18px
}

input,textarea,select{
display:block;
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #aaa;
background:white;
border-radius:4px
}

textarea{
resize:vertical
}

.notice{
background:#e5f1e3;
border:1px solid #b9ceb5;
padding:15px;
margin:15px 0
}

.warning{
background:#f3ead8;
border:1px solid #d7c49e;
padding:15px;
margin-bottom:20px
}

footer{
background:#171717;
color:white;
text-align:center;
padding:45px 20px;
margin-top:80px
}

footer .disclaimer{
max-width:800px;
margin:20px auto 0;

line-height:1.5;
color:#ccc
}

background:#e9e4db;
padding:25px;

}

.admin-tabs{
display:flex;

gap:6px;
margin-bottom:25px
}

.admin-tabs button{
background:white;
border:1px solid #aaa;

}

.admin-tabs button.active{
background:#171717;
color:white
}

.admin-panel{
display:none
}

.admin-panel.active{
display:block
}

.editor{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}

.full{
grid-column:1/-1
}

.admin-item{
background:white;
border:1px solid #d2cbc0;
padding:18px;
margin:12px 0
}

.actions{
display:flex;
gap:7px;

margin-top:12px
}

.smallbtn{
padding:7px 11px;
background:white;

}

.delete{
color:#a00000
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px
}

.stat{
background:white;
border:1px solid #ccc;
padding:20px
}

.stat strong{
font:bold 30px Arial,sans-serif;
display:block
}

.lang-editor{
border:1px solid #ccc;
background:#f8f6f0;
padding:15px;
margin-bottom:15px
}

.lang-title{
font:bold 12px Arial,sans-serif;
letter-spacing:2px;
margin-bottom:10px
}

.login-box{
max-width:420px;
margin:80px auto;
background:#fffdf8;
border:1px solid #d8d1c6;
padding:30px
}

.hidden{
display:none!important
}

@media(max-width:900px){
.header{
display:block
}

nav{
margin-top:15px
}

.editor{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

main{

.hero p{

.logo{
font-size:28px

localStorage.getItem("UGG_LANGUAGE") || "ru";

sessionStorage.getItem("UGG_ADMIN") === "true";

localStorage.setItem("UGG_DATA",JSON.stringify(data));
}


/* =========================================================
   LANGUAGE
========================================================= */

function t(key){
return translations[currentLanguage][key] ||
translations.ru[key] ||
key;
}


function setLanguage(lang){

currentLanguage=lang;

localStorage.setItem("UGG_LANGUAGE",lang);

document.documentElement.lang=lang;

document.querySelectorAll("[data-i18n]").forEach(el=>{
el.textContent=t(el.dataset.i18n);
});

document.querySelectorAll(".languages button")
.forEach(button=>button.classList.remove("active"));

document.getElementById("lang-"+lang)
.classList.add("active");

renderAll();

}


function setStaticTranslations(){

document.querySelectorAll("[data-i18n]").forEach(el=>{
el.textContent=t(el.dataset.i18n);
});

}

function showPage(id){

document.querySelectorAll(".page")
.forEach(page=>page.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

window.scrollTo(0,0);

if(id==="admin"){
updateAdminVisibility();
}

}

function submitApplication(event){

event.preventDefault();

const select=
document.getElementById("appFaculty");

const faculty=
select.options[select.selectedIndex]?.text || "";


data.applications.push({

id:Date.now(),

name:
document.getElementById("appName").value,

email:
document.getElementById("appEmail").value,

faculty:faculty,

message:
document.getElementById("appMessage").value,

date:new Date().toLocaleString()

});

saveData();

document.getElementById("applicationMessage").innerHTML=
`<div class="notice">
${
currentLanguage==="ru"?
"Заявка отправлена. После рассмотрения с вами свяжется администрация.":
currentLanguage==="pt"?
"A solicitação foi enviada. A administração entrará em contato após a análise.":
currentLanguage==="en"?
"The application has been submitted. The administration will contact you after review.":
"La solicitud ha sido enviada. La administración se pondrá en contacto con usted después de revisarla."
}
</div>`;

event.target.reset();

renderAdmin();

}

document.getElementById("applicationsList");

box.innerHTML=
`<p>${t("noApplications")}</p>`;

}

box.innerHTML=

data.applications.map(application=>`

<div class="admin-item">

<strong>${esc(application.name)}</strong>

<p>${esc(application.email)}</p>

<p><strong>${esc(application.faculty)}</strong></p>
