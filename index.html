<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guadanin Galashin Independent University</title>

<meta name="description"
content="Guadanin Galashin Independent University — independent education, research and free thought.">

<style>
:root{
    --navy:#0b1930;
    --navy2:#152846;
    --navy3:#203a62;
    --gold:#c6a354;
    --gold2:#dfc77f;
    --cream:#f5f1e8;
    --cream2:#eae3d5;
    --white:#ffffff;
    --text:#202631;
    --muted:#68717d;
    --border:#d9d0c0;
    --red:#943333;
    --green:#356347;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:var(--cream);
    color:var(--text);
    line-height:1.7;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:var(--navy);
    color:white;
    box-shadow:0 3px 14px rgba(0,0,0,.25);
}

.header-main{
    max-width:1350px;
    margin:auto;
    padding:14px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.mini-crest{
    width:53px;
    height:63px;
}

.mini-crest svg{
    width:100%;
    height:100%;
}

.brand-name{
    font-size:14px;
    font-weight:bold;
    letter-spacing:1.2px;
    line-height:1.25;
}

.languages button{
    background:transparent;
    border:1px solid var(--gold);
    color:white;
    padding:6px 10px;
    margin-left:5px;
}

.languages button:hover,
.languages button.active{
    background:var(--gold);
    color:var(--navy);
}

nav{
    background:var(--navy2);
}

nav ul{
    max-width:1350px;
    margin:auto;
    padding:7px 15px;
    list-style:none;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:2px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:8px 10px;
    font-size:13px;
}

nav a:hover{
    color:var(--gold2);
}

.hero{
    min-height:720px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:80px 25px;
    color:white;
    background:
        radial-gradient(
            circle at center,
            #314f7b 0%,
            var(--navy3) 35%,
            var(--navy) 76%
        );
}

.hero-inner{
    max-width:1050px;
}

.large-crest{
    width:190px;
    height:220px;
    margin:0 auto 30px;
}

.large-crest svg{
    width:100%;
    height:100%;
}

.hero h1{
    font-size:clamp(35px,6vw,72px);
    font-weight:normal;
    letter-spacing:2px;
    line-height:1.05;
}

.hero h2{
    margin-top:18px;
    color:var(--gold2);
    font-weight:normal;
    font-size:clamp(19px,3vw,30px);
    letter-spacing:3px;
}

.hero-description{
    max-width:820px;
    margin:28px auto 0;
    font-size:19px;
}

.motto{
    margin-top:34px;
    color:var(--gold2);
    font-weight:bold;
    letter-spacing:2px;
    font-size:18px;
}

section{
    max-width:1300px;
    margin:auto;
    padding:85px 28px;
}

section:nth-of-type(even){
    background:var(--cream2);
}

.section-title{
    text-align:center;
    margin-bottom:48px;
}

.section-title h2{
    color:var(--navy);
    font-size:42px;
    font-weight:normal;
}

.gold-line{
    width:80px;
    height:3px;
    background:var(--gold);
    margin:14px auto;
}

.section-title p{
    color:var(--muted);
}

.text{
    max-width:900px;
    margin:auto;
    font-size:18px;
}

.text p{
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-top:4px solid var(--gold);
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.card h3{
    color:var(--navy);
    font-size:23px;
    font-weight:normal;
    margin-bottom:12px;
}

.card p{
    color:#555d67;
}

.faculty-number{
    color:var(--gold);
    font-size:28px;
    font-weight:bold;
    margin-bottom:5px;
}

.professor-card img{
    width:100%;
    height:250px;
    object-fit:cover;
    margin-bottom:18px;
}

.professor-placeholder{
    width:100%;
    height:250px;
    margin-bottom:18px;
    background:var(--navy2);
    color:var(--gold2);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:65px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:750px;
    border-collapse:collapse;
    background:white;
}

th,
td{
    padding:14px;
    border:1px solid var(--border);
    text-align:left;
}

th{
    background:var(--navy);
    color:white;
    font-weight:normal;
}

.rule{
    max-width:950px;
    margin:0 auto 32px;
    padding-left:23px;
    border-left:3px solid var(--gold);
}

.rule h3{
    color:var(--navy);
    margin-bottom:8px;
}

.admission-box{
    max-width:1000px;
    margin:auto;
}

.admission-highlight{
    background:var(--navy);
    color:white;
    padding:45px;
    text-align:center;
    border-top:5px solid var(--gold);
    box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.price{
    color:var(--gold2);
    font-size:54px;
    font-weight:bold;
    margin:10px 0;
}

.admission-grid{
    margin-top:25px;
}

.highlight-card{
    text-align:center;
}

.highlight-number{
    font-size:38px;
    color:var(--gold);
    font-weight:bold;
}

.application{
    max-width:900px;
    margin:45px auto 0;
    background:white;
    padding:38px;
    border-top:5px solid var(--gold);
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.application h3{
    color:var(--navy);
    font-weight:normal;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-size:14px;
    color:#4d535c;
    margin-bottom:5px;
}

input,
textarea,
select{
    width:100%;
    padding:11px;
    border:1px solid #cfc7b8;
    background:white;
}

textarea{
    min-height:115px;
    resize:vertical;
}

.button{
    display:inline-block;
    border:1px solid var(--navy);
    background:var(--navy);
    color:white;
    padding:12px 24px;
    margin-top:20px;
    text-decoration:none;
    cursor:pointer;
}

.button:hover{
    background:var(--gold);
    color:var(--navy);
}

.open-day{
    background:#f8f5ee;
    border:1px solid var(--border);
    padding:28px;
    margin-top:25px;
}

.open-day h3{
    color:var(--navy);
    margin-bottom:10px;
}

.support-box{
    max-width:900px;
    margin:auto;
    background:white;
    padding:40px;
    text-align:center;
    border-top:5px solid var(--gold);
}

.pix{
    margin-top:25px;
    padding:18px;
    background:#eeeae1;
    word-break:break-word;
}

footer{
    background:var(--navy);
    color:white;
    text-align:center;
    padding:45px 20px;
}

footer .gold{
    color:var(--gold2);
}

/* ADMIN */

#adminOverlay{
    position:fixed;
    inset:0;
    z-index:5000;
    display:none;
    overflow-y:auto;
    padding:30px 15px;
    background:rgba(0,0,0,.80);
}

.admin-window{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:30px;
}

.admin-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    border-bottom:1px solid var(--border);
    padding-bottom:20px;
    margin-bottom:25px;
}

.admin-header h2{
    color:var(--navy);
    font-weight:normal;
}

.admin-section{
    border:1px solid var(--border);
    padding:25px;
    margin-bottom:22px;
}

.admin-section h3{
    color:var(--navy);
    font-weight:normal;
    margin-bottom:18px;
}

.admin-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.admin-button{
    border:0;
    background:var(--navy);
    color:white;
    padding:10px 18px;
    margin-top:15px;
}

.admin-button:hover{
    background:var(--gold);
    color:var(--navy);
}

.close-button{
    border:1px solid #bbb;
    background:#eee;
    padding:9px 14px;
}

.danger-button{
    border:0;
    background:var(--red);
    color:white;
    padding:7px 10px;
}

.admin-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:12px;
    margin-top:9px;
    background:#f3f0e8;
}

.login-box{
    max-width:450px;
    margin:100px auto;
    padding:35px;
    background:white;
}

.login-box h2{
    color:var(--navy);
    font-weight:normal;
    margin-bottom:20px;
}

.error{
    color:var(--red);
    margin-top:10px;
}

.success{
    color:var(--green);
    margin-top:12px;
}

.application-list{
    max-height:500px;
    overflow:auto;
}

.application-entry{
    border:1px solid var(--border);
    padding:18px;
    margin-top:10px;
    background:#faf8f3;
}

.hidden{
    display:none !important;
}

@media(max-width:800px){

    .header-main{
        flex-direction:column;
    }

    nav ul{
        flex-direction:column;
        align-items:center;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .hero{
        min-height:600px;
    }

    .large-crest{
        width:145px;
        height:170px;
    }

    .admission-highlight{
        padding:30px 20px;
    }

    .price{
        font-size:42px;
    }

    .application{
        padding:25px;
    }
}
</style>
</head>

<body>

<header>

<div class="header-main">

    <div class="brand">

        <div class="mini-crest">

            <svg viewBox="0 0 220 260"

        <button id="langPT" onclick="changeLanguage('pt')">PT</button>
    </div>

</div>

<nav>

<ul>

<li><a href="#home" data-key="home"></a></li>
<li><a href="#about" data-key="about"></a></li>
<li><a href="#faculties" data-key="faculties"></a></li>
<li><a href="#professors" data-key="professors"></a></li>
<li><a href="#students" data-key="students"></a></li>
<li><a href="#courses" data-key="courses"></a></li>
<li><a href="#schedule" data-key="schedule"></a></li>
<li><a href="#publications" data-key="publications"></a></li>
<li><a href="#rules" data-key="rules"></a></li>
<li><a href="#admissions" data-key="admissions"></a></li>
<li><a href="#support" data-key="support"></a></li>

</ul>

</nav>

</header>


<!-- HOME -->

<section id="home" class="hero">

<div class="hero-inner">

<div class="large-crest">

</div>

<h1>GUADANIN GALASHIN</h1>

<h2>INDEPENDENT UNIVERSITY</h2>

<p class="hero-description" data-key="heroText"></p>

<div class="motto">
    FREEDOM OF THOUGHT · STRENGTH OF ARGUMENT
</div>

</div>

</section>


<!-- ABOUT -->

<section id="about">

<div class="section-title">

<h2 data-key="aboutTitle"></h2>

<div class="gold-line"></div>

</div>

<div class="text">

<p data-key="aboutText1"></p>

<p data-key="aboutText2"></p>

</div>

</section>


<!-- FACULTIES -->

<section id="faculties">

<div class="section-title">

<h2 data-key="facultiesTitle"></h2>

<div class="gold-line"></div>

</div>

<div class="grid">

<div class="card">
<div class="faculty-number">01</div>
<h3 data-key="philosophy"></h3>
<p data-key="philosophyDesc"></p>
</div>

<div class="card">
<div class="faculty-number">02</div>
<h3 data-key="political"></h3>
<p data-key="politicalDesc"></p>
</div>

<div class="card">
<div class="faculty-number">03</div>
<h3 data-key="sociology"></h3>
<p data-key="sociologyDesc"></p>
</div>

<div class="card">
<div class="faculty-number">04</div>
<h3 data-key="cinema"></h3>
<p data-key="cinemaDesc"></p>
</div>

<div class="card">
<div class="faculty-number">05</div>
<h3 data-key="history"></h3>
<p data-key="historyDesc"></p>
</div>

<div class="card">
<div class="faculty-number">06</div>
<h3 data-key="russianCulture"></h3>
<p data-key="russianCultureDesc"></p>
</div>

<div class="card">
<div class="faculty-number">+</div>
<h3 data-key="literature"></h3>
<p data-key="literatureDesc"></p>
</div>

</div>

</section>


<!-- PROFESSORS -->

<section id="professors">

<div class="section-title">

<h2 data-key="professorsTitle"></h2>

<div class="gold-line"></div>

<p data-key="professorsSubtitle"></p>

</div>

<div id="professorGrid" class="grid"></div>

</section>


<!-- STUDENTS -->

<section id="students">

<div class="section-title">

<h2 data-key="studentsTitle"></h2>

<div class="gold-line"></div>

</div>

<div class="text">

<p data-key="studentsText"></p>

</div>

</section>


<!-- COURSES -->

<section id="courses">

<div class="section-title">

<h2 data-key="coursesTitle"></h2>

<div class="gold-line"></div>

</div>

<div id="courseGrid" class="grid"></div>

</section>


<!-- SCHEDULE -->

<section id="schedule">

<div class="section-title">

<h2 data-key="scheduleTitle"></h2>

<div class="gold-line"></div>

</div>

<div class="table-wrap">

<table>

<thead>

<tr>
<th data-key="day"></th>
<th data-key="time"></th>
<th data-key="course"></th>
<th data-key="professor"></th>
<th data-key="location"></th>
</tr>

</thead>

<tbody id="scheduleBody"></tbody>

</table>

</div>

</section>


<!-- PUBLICATIONS -->

<section id="publications">

<div class="section-title">

<h2 data-key="publicationsTitle"></h2>

<div class="gold-line"></div>

</div>

<div id="publicationGrid" class="grid"></div>

</section>


<!-- RULES -->

<section id="rules">

<div class="section-title">

<h2 data-key="rulesTitle"></h2>

<div class="gold-line"></div>

</div>

<div class="rule">
<h3 data-key="rule1Title"></h3>
<p data-key="rule1Text"></p>
</div>

<div class="rule">
<h3 data-key="rule2Title"></h3>
<p data-key="rule2Text"></p>
</div>

<div class="rule">
<h3 data-key="rule3Title"></h3>
<p data-key="rule3Text"></p>
</div>

<div class="rule">
<h3 data-key="rule4Title"></h3>
<p data-key="rule4Text"></p>
</div>

<div class="rule">
<h3 data-key="rule5Title"></h3>
<p data-key="rule5Text"></p>
</div>

</section>


<!-- ADMISSIONS -->

<section id="admissions">

<div class="section-title">

<h2 data-key="admissionsTitle"></h2>

<div class="gold-line"></div>

</div>


<div class="admission-box">


<div class="admission-highlight">

<h3 id="semesterPriceTitle"></h3>

<div class="price" id="semesterPrice"></div>

<p id="admissionLoad"></p>

</div>


<div class="grid admission-grid">


<div class="card highlight-card">

<div class="highlight-number"
     id="scholarshipSeats">
0
</div>

<h3 id="freeSeatsTitle"></h3>

<p id="freeSeatsText"></p>

</div>


<div class="card highlight-card">

<div class="highlight-number">
2
</div>

<h3 id="minimumClassesTitle"></h3>

<p id="minimumClassesText"></p>

</div>


<div class="card highlight-card">

<div class="highlight-number">
24
</div>

<h3 id="semesterWeeksTitle"></h3>

<p id="semesterWeeksText"></p>

</div>


</div>


<div class="card" style="margin-top:25px;">

<h3 id="entranceTestTitle"></h3>

<p id="entranceTestText"></p>

</div>


<div class="card" style="margin-top:25px;">

<h3 id="admissionProcessTitle"></h3>

<p id="admissionProcessText"></p>

</div>


<div class="open-day">

<h3 id="openDayTitle"></h3>

<p id="openDayDate"></p>

<p id="openDayText"></p>

</div>


<div class="application" id="applicationForm">

<h3 id="applicationTitle"></h3>

<div class="form-grid">

<div>
<label id="applicationNameLabel"></label>
<input id="applicationName">
</div>

<div>
<label id="applicationEmailLabel"></label>
<input id="applicationEmail" type="email">
</div>

<div>
<label id="applicationCountryLabel"></label>
<input id="applicationCountry">
</div>

<div>
<label id="applicationFacultyLabel"></label>
<select id="applicationFaculty">
<option value="Philosophy">Philosophy</option>
<option value="Political Science">Political Science</option>
<option value="Sociology">Sociology</option>
<option value="Cinema">Cinema</option>
<option value="History">History</option>
<option value="Russian Language and Culture">Russian Language and Culture</option>
</select>
</div>

<div class="full">
<label id="applicationMotivationLabel"></label>
<textarea id="applicationMotivation"></textarea>
</div>

</div>

<button class="button"
        onclick="submitApplication()"
        id="applicationButton">
</button>

<p id="applicationMessage"
   class="success"></p>

</div>


</div>

</section>


<!-- SUPPORT -->

<section id="support">

<div class="section-title">

<h2 data-key="supportTitle"></h2>

<div class="gold-line"></div>

</div>

<div class="support-box">

<p id="supportText"></p>

<div class="pix">
<strong>PIX:</strong>
<span id="pixValue"></span>
</div>

</div>

</section>


<footer>

<p class="gold">
GUADANIN GALASHIN INDEPENDENT UNIVERSITY
</p>

<p>
FREEDOM OF THOUGHT · STRENGTH OF ARGUMENT
</p>

<button class="button"
        onclick="openAdmin()"
        id="adminButton">
Admin
</button>

</footer>

<!-- LOGIN -->

<div id="adminLogin"

<h2 id="adminLoginTitle"></h2>

<label id="passwordLabel"></label>

<input

</button>

function load(key,fallback){

    try{

        const raw =
            localStorage.getItem(key);

        if(!raw){
            return fallback;
        }

        return JSON.parse(raw);

    }catch(error){

        return fallback;

    }

}


function saveData(){

    localStorage.setItem(
        "ugg_data",
        JSON.stringify(data)
    );

}

function setText(id,text){

    const element =
        document.getElementById(id);

    if(element){
        element.textContent = text || "";
    }

}


function changeLanguage(language){

    currentLanguage = language;

    localStorage.setItem(
        "ugg_language",
        language
    );

    document.documentElement.lang =
        language;

    const dictionary =
        T[language];

    document
        .querySelectorAll("[data-key]")
        .forEach(element => {

            const key =
                element.getAttribute("data-key");

            if(dictionary[key]){
                element.textContent =
                    dictionary[key];
            }

        });


    [
        "langRU",
        "langEN",
        "langPT"
    ].forEach(id => {

        document
            .getElementById(id)
            .classList.remove("active");

    });

    document
        .getElementById(
            "lang" + language.toUpperCase()
        )
        .classList.add("active");


    renderDynamicText();

    renderAdminInterface();

}

function escapeHTML(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   PUBLIC RENDERING
   ========================================================= */

function renderPublic(){

    data =
        load("ugg_data",data);


    const professorGrid =
        document.getElementById(
            "professorGrid"
        );

    if(data.professors.length === 0){

        professorGrid.innerHTML = `
            <div class="card">
                <h3>${escapeHTML(
                    T[currentLanguage].professorsTitle
                )}</h3>
                <p>
                    ${escapeHTML(
                        T[currentLanguage].noProfessors
                    )}
                </p>
            </div>
        `;

    }else{

        professorGrid.innerHTML =
            data.professors.map(prof => {

                const photo =
                    prof.photo
                    ? `<img src="${escapeHTML(
                        prof.photo
                    )}" alt="${escapeHTML(
                        prof.name
                    )}">`
                    : `<div class="professor-placeholder">
                        ✦
                       </div>`;

                return `
                    <div class="card professor-card">

                        ${photo}

                        <h3>
                            ${escapeHTML(prof.name)}
                        </h3>

                        <p>
                            <strong>
                                ${escapeHTML(prof.faculty)}
                            </strong>
                        </p>

                        <br>

                        <p>
                            ${escapeHTML(prof.bio)}
                        </p>

                    </div>
                `;

            }).join("");

    }


    const courseGrid =
        document.getElementById(
            "courseGrid"
        );

    if(data.courses.length === 0){

        courseGrid.innerHTML = `
            <div class="card">
                <h3>${escapeHTML(
                    T[currentLanguage].coursesTitle
                )}</h3>

                <p>
                    ${escapeHTML(
                        T[currentLanguage].noCourses
                    )}
                </p>
            </div>
        `;

    }else{

        courseGrid.innerHTML =
            data.courses.map(course => {

                return `
                    <div class="card">

                        <h3>
                            ${escapeHTML(course.name)}
                        </h3>

                        <p>
                            <strong>
                                ${escapeHTML(course.faculty)}
                            </strong>
                        </p>

                        <br>

                        <p>
                            ${escapeHTML(course.description)}
                        </p>

                    </div>
                `;

            }).join("");

    }


    const scheduleBody =
        document.getElementById(
            "scheduleBody"
        );

    if(data.schedule.length === 0){

        scheduleBody.innerHTML = `
            <tr>
                <td colspan="5">
                    ${escapeHTML(
                        T[currentLanguage].noSchedule
                    )}
                </td>
            </tr>
        `;

    }else{

        scheduleBody.innerHTML =
            data.schedule.map(item => {

                return `
                    <tr>
                        <td>${escapeHTML(item.day)}</td>
                        <td>${escapeHTML(item.time)}</td>
                        <td>${escapeHTML(item.course)}</td>
                        <td>${escapeHTML(item.professor)}</td>
                        <td>${escapeHTML(item.location)}</td>
                    </tr>
                `;

            }).join("");

    }


    const publicationGrid =
        document.getElementById(
            "publicationGrid"
        );

    if(data.publications.length === 0){

        publicationGrid.innerHTML = `
            <div class="card">

                <h3>
                    ${escapeHTML(
                        T[currentLanguage].publicationsTitle
                    )}
                </h3>

                <p>
                    ${escapeHTML(
                        T[currentLanguage].noPublications
                    )}
                </p>

            </div>
        `;

    }else{

        publicationGrid.innerHTML =
            data.publications.map(pub => {

                return `
                    <div class="card">

                        <h3>
                            ${escapeHTML(pub.title)}
                        </h3>

                        <p>
                            <strong>
                                ${escapeHTML(pub.author)}
                            </strong>
                        </p>

                        <br>

                        <p>
                            ${escapeHTML(pub.description)}
                        </p>

                        ${
                            pub.url
                            ? `
                                <a
                                    class="button"
                                    href="${escapeHTML(pub.url)}"
                                    target="_blank"
                                    rel="noopener"
                                >
                                    ${currentLanguage === "ru"
                                    ? "Открыть"
                                    : currentLanguage === "en"
                                    ? "Open"
                                    : "Abrir"}
                                </a>
                            `
                            : ""
                        }

                    </div>
                `;

            }).join("");

    }


    renderDynamicText();

}

function submitApplication(){

    const name =
        document.getElementById(
            "applicationName"
        ).value.trim();

    const email =
        document.getElementById(
            "applicationEmail"
        ).value.trim();

    const country =
        document.getElementById(
            "applicationCountry"
        ).value.trim();

    const faculty =
        document.getElementById(
            "applicationFaculty"
        ).value;

    const motivation =
        document.getElementById(
            "applicationMotivation"
        ).value.trim();

    if(!name || !email || !country || !motivation){

        alert(
            currentLanguage === "ru"
            ? "Заполните все обязательные поля."
            : currentLanguage === "en"
            ? "Please complete all required fields."
            : "Preencha todos os campos obrigatórios."
        );

        return;

    }


    data.applications.push({

        id:Date.now(),

        name,

        email,

        country,

        faculty,

        motivation,

        date:new Date().toLocaleString()

    });


    saveData();

    document.getElementById(
        "applicationName"
    ).value="";

    document.getElementById(
        "applicationEmail"
    ).value="";

    document.getElementById(
        "applicationCountry"
    ).value="";

    document.getElementById(
        "applicationMotivation"
    ).value="";


    const message =
        document.getElementById(
            "applicationMessage"
        );

    message.textContent =
        T[currentLanguage].applicationSuccess;

    renderAdminLists();

}

    const password =
        document.getElementById(
            "adminPassword"
        ).value;

    const error =
        document.getElementById(
            "loginError"
        );

    if(password === ADMIN_PASSWORD){

        document.getElementById(
            "adminLogin"
        ).style.display="none";

        document.getElementById(
            "adminPanel"
        ).classList.remove("hidden");

        loadAdminForms();

        renderAdminInterface();

        renderAdminLists();

    }else{

        error.textContent =
            currentLanguage === "ru"
            ? "Неверный пароль."
            : currentLanguage === "en"
            ? "Incorrect password."
            : "Senha incorreta.";

    }

}

        document.getElementById(
            "publicationAuthor"
        ).value.trim();

    const description =
        document.getElementById(
            "publicationDescription"
        ).value.trim();

    const url =
        document.getElementById(
            "publicationUrl"
        ).value.trim();

    if(!title){

        alert(
            currentLanguage === "ru"
            ? "Введите название публикации."
            : currentLanguage === "en"
            ? "Enter publication title."
            : "Digite o título da publicação."
        );

        return;

    }

    data.publications.push({
        title,
        author,
        description,
        url
    });

    saveData();

    document.getElementById(
        "publicationTitle"
    ).value="";

    document.getElementById(
        "publicationAuthor"
    ).value="";

    document.getElementById(
        "publicationDescription"
    ).value="";

    document.getElementById(
        "publicationUrl"
    ).value="";

    renderPublic();
    renderAdminLists();

}


function deletePublication(index){

    data.publications.splice(
        index,
        1
    );

    saveData();

    renderPublic();
    renderAdminLists();

}


/* =========================================================
   SUPPORT
   ========================================================= */

function saveSupport(){

    data.support.text =
        document.getElementById(
            "supportInput"
        ).value.trim();

    data.support.pix =
        document.getElementById(
            "pixInput"
        ).value.trim();

    saveData();

    renderPublic();

    document.getElementById(
        "supportSaveMessage"
    ).textContent =
        currentLanguage === "ru"
        ? "Информация сохранена."
        : currentLanguage === "en"
        ? "Information saved."
        : "Informações salvas.";

}


/* =========================================================
   ADMIN LISTS
   ========================================================= */

function renderAdminLists(){

    const t=T[currentLanguage];


    const professorList =
        document.getElementById(
            "professorAdminList"
        );

    professorList.innerHTML =
        data.professors.map(
            (prof,index) => {

                return `
                    <div class="admin-item">

                        <span>
                            ${escapeHTML(
                                prof.name
                            )}
                        </span>

                        <button
                            class="danger-button"
                            onclick="deleteProfessor(${index})"
                        >
                            ${escapeHTML(t.delete)}
                        </button>

                    </div>
                `;

            }
        ).join("");


    const courseList =
        document.getElementById(
            "courseAdminList"
        );

    courseList.innerHTML =
        data.courses.map(
            (course,index) => {

                return `
                    <div class="admin-item">

                        <span>
                            ${escapeHTML(
                                course.name
                            )}
                        </span>

                        <button
                            class="danger-button"
                            onclick="deleteCourse(${index})"
                        >
                            ${escapeHTML(t.delete)}
                        </button>

                    </div>
                `;

            }
        ).join("");


    const scheduleList =
        document.getElementById(
            "scheduleAdminList"
        );

    scheduleList.innerHTML =
        data.schedule.map(
            (item,index) => {

                return `
                    <div class="admin-item">

                        <span>
                            ${escapeHTML(item.day)}
                            ${escapeHTML(item.time)}
                            —
                            ${escapeHTML(item.course)}
                        </span>

                        <button
                            class="danger-button"
                            onclick="deleteSchedule(${index})"
                        >
                            ${escapeHTML(t.delete)}
                        </button>

                    </div>
                `;

            }
        ).join("");


    const publicationList =
        document.getElementById(
            "publicationAdminList"
        );

    publicationList.innerHTML =
        data.publications.map(
            (pub,index) => {

                return `
                    <div class="admin-item">

                        <span>
                            ${escapeHTML(pub.title)}
                        </span>

                        <button
                            class="danger-button"
                            onclick="deletePublication(${index})"
                        >
                            ${escapeHTML(t.delete)}
                        </button>

                    </div>
                `;

            }
        ).join("");


    const applications =
        document.getElementById(
            "applicationAdminList"
        );

    if(data.applications.length === 0){

        applications.innerHTML = `
            <p>
                ${escapeHTML(
                    t.noApplications
                )}
            </p>
        `;

    }else{

        applications.innerHTML =
            data.applications.map(
                application => {

                    return `
                        <div class="application-entry">

                            <strong>
                                ${escapeHTML(
                                    application.name
                                )}
                            </strong>

                            <br>

                            ${escapeHTML(
                                application.email
                            )}

                            <br>

                            ${escapeHTML(
                                application.country
                            )}

                            <br>

                            ${escapeHTML(
                                application.faculty
                            )}

                            <br><br>

                            ${escapeHTML(
                                application.motivation
                            )}

                            <br><br>

                            <small>
                                ${escapeHTML(
                                    application.date
                                )}
                            </small>

                        </div>
                    `;

                }
            ).join("");

    }

}


/* =========================================================
   INITIALIZE
   ========================================================= */

changeLanguage(
    currentLanguage
);

renderPublic();

</script>

</body>
</html>
